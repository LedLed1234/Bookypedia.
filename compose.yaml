services:
  app:
    build:
      context: .
      target: development
    command: flask --app run.py run --debug --host=0.0.0.0 --port=5000
    environment:
      DATABASE_PATH: /data/readmore.db
      BOOK_PROVIDER: open_library
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
      - readmore_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  readmore_data:

