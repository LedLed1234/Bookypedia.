services:
  app:
    build:
      context: .
      target: production
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 --error-logfile - run:app
    environment:
      DATABASE_PATH: /data/readmore.db
      BOOK_PROVIDER: ${BOOK_PROVIDER:-}
      BOOK_FALLBACK_PROVIDER: ${BOOK_FALLBACK_PROVIDER:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss in der .env-Datei gesetzt sein}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - readmore_prod_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  readmore_prod_data:

