services:
  app:
    environment:
      SESSION_COOKIE_SECURE: "1"
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      BOOKYPEDIA_DOMAIN: ${BOOKYPEDIA_DOMAIN:?BOOKYPEDIA_DOMAIN muss in der .env-Datei gesetzt sein}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
