<!doctype html>
<html lang="de" data-theme="blue-white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101512">
  <title>Passwort ändern – Bookypedia.</title>
  <script>
    try {
      const android = window.Capacitor?.getPlatform?.() === "android" || navigator.userAgent.includes("BookypediaAndroid");
      if (android) document.documentElement.classList.add("platform-android");
      const themeDefaultVersion = "blue-white-v1";
      if (localStorage.getItem("bookypedia-theme-default-version") !== themeDefaultVersion) {
        localStorage.setItem("bookypedia-theme", "blue-white");
        localStorage.setItem("bookypedia-theme-default-version", themeDefaultVersion);
      }
      const savedTheme = localStorage.getItem("bookypedia-theme");
      if (["red", "blue-white", "green", "brown", "cozy", "light"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch (_error) {}
  </script>
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=35">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="{{ url_for('index') }}">Bookypedia.</a>
    <section class="auth-card" aria-labelledby="password-title">
      <div class="auth-heading">
        <p class="eyebrow">Kontosicherheit</p>
        <h1 id="password-title">Passwort ändern</h1>
        <p>{% if forced %}Lege vor dem ersten Start dein persönliches Passwort fest.{% else %}Ändere das Passwort für dein Bookypedia-Konto.{% endif %}</p>
      </div>
      {% if error %}<div class="auth-message error" role="alert">{{ error }}</div>{% endif %}
      <form class="auth-form" method="post" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Aktuelles Passwort
          <input name="current_password" type="password" required maxlength="256" autocomplete="current-password" autofocus>
        </label>
        <label>Neues Passwort
          <input name="new_password" type="password" required minlength="5" maxlength="256" autocomplete="new-password">
          <small>Mindestens 12 Zeichen. Eine lange Passphrase ist ideal.</small>
        </label>
        <label>Neues Passwort wiederholen
          <input name="password_confirmation" type="password" required minlength="5" maxlength="256" autocomplete="new-password">
        </label>
        <button class="button button-primary auth-submit" type="submit">Passwort speichern</button>
      </form>
      {% if not forced %}<a class="auth-back" href="{{ url_for('index') }}">← Zurück zur Bibliothek</a>{% endif %}
    </section>
  </main>
</body>
</html>
